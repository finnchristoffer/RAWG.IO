name: 'Setup Xcode'
description: 'Setup Xcode, accept license, and optionally boot iOS simulator'

inputs:
  xcode-version:
    description: 'Xcode version to use'
    required: false
    default: '16.2'
  boot-simulator:
    description: 'Whether to boot an iOS simulator'
    required: false
    default: 'false'

outputs:
  device-udid:
    description: 'UDID of the booted simulator (only when boot-simulator is true)'
    value: ${{ steps.simulator.outputs.device_udid }}

runs:
  using: 'composite'
  steps:
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode-version }}

    - name: Prepare Xcode
      shell: bash
      run: |
        sudo xcodebuild -license accept
        sudo xcodebuild -runFirstLaunch

    - name: Install iOS Simulator Runtime
      shell: bash
      run: |
        if xcrun simctl list runtimes 2>/dev/null | grep -q "iOS.*Available"; then
          echo "✅ iOS runtime already available — skipping download"
          xcrun simctl list runtimes | grep "iOS"
        else
          echo "⬇️ No iOS runtime found — downloading..."
          for attempt in 1 2 3; do
            echo "Attempt $attempt/3..."
            if xcodebuild -downloadPlatform iOS; then
              echo "✅ Download successful"
              break
            fi
            echo "Download failed, retrying in 60s..."
            sleep 60
          done
        fi

    - name: Prepare Simulator Service
      if: inputs.boot-simulator == 'true'
      shell: bash
      run: |
        sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService || true
        sleep 5

    - name: Boot Simulator
      if: inputs.boot-simulator == 'true'
      id: simulator
      shell: bash
      run: |
        RUNTIME_ID=$(xcrun simctl list runtimes -j | jq -r '.runtimes[] | select(.isAvailable==true) | select(.name | contains("iOS")) | .identifier' | tail -1)
        echo "Found Runtime ID: $RUNTIME_ID"

        if [ -z "$RUNTIME_ID" ]; then
          echo "Failed to find iOS runtime ID!"
          xcrun simctl list runtimes
          exit 1
        fi

        DEVICETYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-16"
        NAME="ci-${{ github.workflow }}-$RANDOM"

        echo "Creating simulator '$NAME'..."
        UDID=$(xcrun simctl create "$NAME" "$DEVICETYPE" "$RUNTIME_ID")
        echo "Created simulator: $NAME ($UDID)"

        echo "Booting simulator..."
        xcrun simctl boot "$UDID" || true

        echo "Waiting for boot..."
        for i in $(seq 1 30); do
          STATE=$(xcrun simctl list devices -j | jq -r ".devices[\"$RUNTIME_ID\"][] | select(.udid==\"$UDID\") | .state")
          echo "  State: $STATE"
          if [ "$STATE" = "Booted" ]; then
            echo "Simulator booted!"
            break
          fi
          sleep 2
        done

        echo "device_udid=$UDID" >> $GITHUB_OUTPUT
