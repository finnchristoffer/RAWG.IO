name: Periphery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**/*.swift'
      - '.periphery.yml'
      - 'Project.swift'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  periphery:
    name: Dead Code Detection
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for relevant changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            swift:
              - '**/*.swift'
              - '.periphery.yml'
              - 'Project.swift'

      - name: Setup Xcode
        if: steps.filter.outputs.swift == 'true'
        uses: ./.github/actions/setup-xcode

      - name: Setup Tuist
        if: steps.filter.outputs.swift == 'true'
        uses: ./.github/actions/setup-tuist

      - name: Cache Homebrew Downloads
        if: steps.filter.outputs.swift == 'true'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-brew-periphery-v2
          restore-keys: |
            ${{ runner.os }}-brew-periphery-

      - name: Install Periphery
        if: steps.filter.outputs.swift == 'true'
        run: |
          brew tap peripheryapp/periphery
          brew install periphery
          which periphery && periphery version

      - name: Cache DerivedData
        if: steps.filter.outputs.swift == 'true'
        uses: actions/cache@v4
        with:
          path: .derivedData
          key: ${{ runner.os }}-deriveddata-periphery-${{ hashFiles('**/*.swift', 'Project.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-periphery-

      - name: Build with Tuist
        if: steps.filter.outputs.swift == 'true'
        run: |
          tuist build RAWGApp -- \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath .derivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Run Periphery
        if: steps.filter.outputs.swift == 'true'
        run: |
          periphery scan \
            --project RAWG.xcodeproj \
            --schemes RAWGApp \
            --skip-build \
            --index-store-path .derivedData/Index.noindex/DataStore \
            --targets RAWGApp \
            --targets Core \
            --targets CoreUI \
            --targets CoreNetwork \
            --targets GamesFeature \
            --targets SearchFeature \
            --targets FavoritesFeature \
            --format github-actions \
            --relative-results \
            --retain-public \
            --retain-objc-accessible \
            --quiet

      - name: Skip notice
        if: steps.filter.outputs.swift != 'true'
        run: echo "No Swift/project files changed — skipping dead code detection"