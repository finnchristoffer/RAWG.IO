name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '**/*.swift'
      - 'Project.swift'
      - 'Tuist/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit Tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Xcode
        id: setup-xcode
        uses: ./.github/actions/setup-xcode
        with:
          boot-simulator: 'true'

      - name: Setup Tuist
        uses: ./.github/actions/setup-tuist

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: ${{ runner.os }}-deriveddata-tests-${{ hashFiles('**/*.swift', 'Project.swift') }}
          restore-keys: |
            ${{ runner.os }}-deriveddata-tests-

      - name: Run Tests
        env:
          SIMULATOR_UDID: ${{ steps.setup-xcode.outputs.device-udid }}
        run: |
          xcodebuild test \
            -workspace RAWG.xcworkspace \
            -scheme RAWGApp \
            -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --report junit --output test-results.xml

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            TestResults.xcresult
            test-results.xml
          retention-days: 14

      - name: Cleanup Simulator
        if: always()
        run: |
          xcrun simctl delete "${{ steps.setup-xcode.outputs.device-udid }}" || true
